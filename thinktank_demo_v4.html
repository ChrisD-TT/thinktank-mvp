<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ThinkTank OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#fff;overflow:hidden}

/* ── canvas fills everything ── */
canvas{position:fixed;inset:0;z-index:0}

/* ── brand ── */
#brand{position:fixed;top:28px;left:36px;z-index:20;pointer-events:none}
#brand h1{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.9)}
#brand p{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.18);margin-top:3px}

/* ── single narrator line ── */
#narrator{
  position:fixed;bottom:110px;left:50%;transform:translateX(-50%);
  z-index:20;pointer-events:none;
  text-align:center;width:680px;max-width:92vw;
}
#narrator-text{
  font-size:22px;font-weight:300;line-height:1.45;
  color:rgba(255,255,255,.92);letter-spacing:.01em;
  transition:opacity .5s ease;
  text-shadow:0 0 40px rgba(0,0,0,.8);
}
#narrator-text strong{font-weight:700;color:#fff}
#narrator-text em{font-style:normal;color:#34d399}
#narrator-sub{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.22);margin-top:12px;
  transition:opacity .5s ease;
}

/* ── scenario pills ── */
#pills{
  position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;gap:8px;align-items:center;
}
.pill{
  border:1px solid rgba(255,255,255,.12);border-radius:20px;
  background:rgba(255,255,255,.04);backdrop-filter:blur(4px);
  color:rgba(255,255,255,.35);font-family:inherit;font-size:10px;
  font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:8px 18px;cursor:pointer;transition:all .25s;white-space:nowrap;
}
.pill:hover{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.8)}
.pill.active{
  border-color:var(--c);color:var(--c);
  background:rgba(255,255,255,.06);
  box-shadow:0 0 18px var(--c), inset 0 0 10px rgba(0,0,0,.3);
}
.p0{--c:#34d399}.p1{--c:#f87171}.p2{--c:#fbbf24}
.p3{--c:#60a5fa}.p4{--c:#a78bfa}.p5{--c:#2dd4bf}

/* ── KPI strip (top right) ── */
#kpis{position:fixed;top:24px;right:32px;z-index:20;display:flex;gap:24px;pointer-events:none}
.kpi{text-align:right}
.kpi-v{font-size:18px;font-weight:800;line-height:1}
.kpi-l{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2);margin-top:3px}
.kg{color:#34d399}.kb{color:#60a5fa}.kp{color:#a78bfa}

/* ── agent thought bubble ── */
#thought{
  position:fixed;top:50%;right:40px;transform:translateY(-50%);
  z-index:20;pointer-events:none;opacity:0;transition:opacity .6s;
  text-align:right;max-width:200px;
}
#thought .tq{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.2);margin-bottom:8px}
#thought .to{font-size:11px;font-weight:700;color:#34d399;line-height:1.5;margin-bottom:4px}
#thought .ts{font-size:10px;color:#60a5fa;line-height:1.5}
#thought .tc{font-size:10px;color:rgba(255,255,255,.3);margin-top:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="brand">
  <h1>ThinkTank OS</h1>
  <p>Autonomous Operations Platform</p>
</div>

<div id="kpis">
  <div class="kpi"><div class="kpi-v kg">100%</div><div class="kpi-l">Asset SOH</div></div>
  <div class="kpi"><div class="kpi-v kb" id="k-batt">83J</div><div class="kpi-l">Energy</div></div>
  <div class="kpi"><div class="kpi-v kp" id="k-vics">55J</div><div class="kpi-l">VICS</div></div>
</div>

<div id="thought">
  <div class="tq">Agent Reasoning</div>
  <div class="to" id="th-obj">—</div>
  <div class="ts" id="th-strat">—</div>
  <div class="tc" id="th-conf">—</div>
</div>

<div id="narrator">
  <div id="narrator-text"></div>
  <div id="narrator-sub"></div>
</div>

<div id="pills">
  <button class="pill p0 active" data-i="0">Normal</button>
  <button class="pill p1"        data-i="1">Power Surge</button>
  <button class="pill p2"        data-i="2">Load Spike</button>
  <button class="pill p3"        data-i="3">Grid Failure</button>
  <button class="pill p4"        data-i="4">Contaminant</button>
  <button class="pill p5"        data-i="5">Recovery</button>
</div>

<script>
// ─────────────────────────────────────────────
// CANVAS ENGINE
// ─────────────────────────────────────────────
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
let W, H;

function resize() {
  cv.width  = W = window.innerWidth;
  cv.height = H = window.innerHeight;
  buildNodes();
}
window.addEventListener('resize', resize);

// Node layout
let N = {};
function buildNodes() {
  const cx2 = W/2, cy2 = H/2;
  const r = Math.min(W,H) * 0.32;
  N = {
    mut:  {x:cx2,        y:cy2-r*1.08, label:'MUT',      color:'#4ade80', size:44, glow:0, scale:1, alertCol:null, alertT:0},
    sc1:  {x:cx2,        y:cy2-r*0.62, label:'SC1',       color:'#fbbf24', size:28, glow:0, scale:1, alertCol:null, alertT:0},
    bank: {x:cx2,        y:cy2-r*0.14, label:'BANK',      color:'#3b82f6', size:50, glow:0, scale:1, alertCol:null, alertT:0},
    va:   {x:cx2-r*0.38, y:cy2+r*0.22, label:'VICS A',    color:'#818cf8', size:28, glow:0, scale:1, alertCol:null, alertT:0},
    vb:   {x:cx2,        y:cy2+r*0.30, label:'VICS B',    color:'#a78bfa', size:36, glow:0, scale:1, alertCol:null, alertT:0},
    vc:   {x:cx2+r*0.38, y:cy2+r*0.22, label:'VICS C',    color:'#c084fc', size:28, glow:0, scale:1, alertCol:null, alertT:0},
    cea:  {x:cx2,        y:cy2+r*0.72, label:'ASSET',     color:'#34d399', size:50, glow:0, scale:1, alertCol:null, alertT:0},
    d2:   {x:cx2-r*0.44, y:cy2+r*1.02, label:'D2',        color:'#60a5fa', size:28, glow:0, scale:1, alertCol:null, alertT:0},
    d3:   {x:cx2+r*0.44, y:cy2+r*1.02, label:'D3',        color:'#60a5fa', size:28, glow:0, scale:1, alertCol:null, alertT:0},
  };
}

// Colour helpers
function h2r(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function lighten(h,a){const[r,g,b]=h2r(h);return`rgb(${Math.min(255,r+a*255|0)},${Math.min(255,g+a*255|0)},${Math.min(255,b+a*255|0)})`}
function darken(h,a) {const[r,g,b]=h2r(h);return`rgb(${Math.max(0,r-a*255|0)},${Math.max(0,g-a*255|0)},${Math.max(0,b-a*255|0)})`}
function lerpCol(a,b,t){const[r1,g1,b1]=h2r(a),[r2,g2,b2]=h2r(b);return'#'+[r1+(r2-r1)*t,g1+(g2-g1)*t,b1+(b2-b1)*t].map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}

// Particles
const PMAX = 240;
const P = Array.from({length:PMAX},()=>({on:false,x:0,y:0,sx:0,sy:0,tx:0,ty:0,ex:0,ey:0,t:0,spd:0,col:'#fff',sz:4,tr:[]}));

function shoot(from, to, col, n, sz, delay) {
  for(let i=0;i<n;i++) {
    setTimeout(()=>{
      const p=P.find(p=>!p.on); if(!p) return;
      const a=N[from],b=N[to]; if(!a||!b) return;
      p.on=true; p.t=0; p.tr=[];
      p.sx=a.x; p.sy=a.y; p.tx=b.x; p.ty=b.y; p.x=a.x; p.y=a.y;
      p.ex=(a.x+b.x)/2+(Math.random()-.5)*80;
      p.ey=(a.y+b.y)/2+(Math.random()-.5)*80;
      p.spd=0.009+Math.random()*0.007; p.col=col; p.sz=sz||5;
    }, (delay||0) + i*160 + Math.random()*50);
  }
}

function pulse(k,s,col){
  if(!N[k])return;
  N[k].glow=1; N[k].scale=s||1.4;
  if(col){N[k].alertCol=col;N[k].alertT=1;}
}

// Camera
let cam={ox:0,oy:0,z:1}, camT={ox:0,oy:0,z:1};

// Edges
const EDGES=[
  {a:'mut', b:'sc1',  c:'#fbbf24'},
  {a:'sc1', b:'bank', c:'#3b82f6'},
  {a:'bank',b:'va',   c:'#818cf8'},
  {a:'va',  b:'vb',   c:'#a78bfa'},
  {a:'vb',  b:'vc',   c:'#c084fc'},
  {a:'vc',  b:'cea',  c:'#34d399'},
  {a:'cea', b:'d2',   c:'#60a5fa'},
  {a:'cea', b:'d3',   c:'#60a5fa'},
  {a:'d2',  b:'bank', c:'#f87171'},
  {a:'d3',  b:'bank', c:'#f87171'},
];

const NKEYS = ['mut','sc1','bank','va','vb','vc','cea','d2','d3'];

// ─────────────────────────────────────────────
// SCENARIOS — each is a timed sequence of acts
// ─────────────────────────────────────────────
const SC = [
  // 0 — Normal
  {
    color:'#34d399',
    obj:'Maintain Asset Floor', strat:'Regulate 14J/tick via VICS C', conf:'96%',
    cam:{ox:0,oy:0,z:1.0},
    voice:"The system is <strong>running nominally</strong>.",
    sub:"ENERGY FLOWING · ASSET PROTECTED · SOH 100%",
    acts:[
      {t:0,    fn:()=>{ shoot('mut','sc1','#fbbf24',3,5); }},
      {t:0.8,  fn:()=>{ shoot('sc1','bank','#3b82f6',4,5); pulse('sc1',1.2); }},
      {t:1.5,  fn:()=>{ shoot('bank','va','#818cf8',3,4); }},
      {t:2.1,  fn:()=>{ shoot('va','vb','#a78bfa',3,5); pulse('va',1.2); }},
      {t:2.6,  fn:()=>{ shoot('vb','vc','#c084fc',3,5); }},
      {t:3.1,  fn:()=>{ shoot('vc','cea','#34d399',4,5); pulse('vc',1.2); pulse('vb',1.1); }},
      {t:3.7,  fn:()=>{ shoot('cea','d2','#60a5fa',3,5); shoot('cea','d3','#60a5fa',3,5); pulse('cea',1.15); }},
      {t:4.3,  fn:()=>{ pulse('d2',1.2); pulse('d3',1.2); }},
      {t:4.8,  fn:()=>{ shoot('d2','bank','#f87171',2,4); shoot('d3','bank','#f87171',2,4); }},
      {t:5.4,  fn:()=>{ pulse('bank',1.1); }},
    ],
    len: 6.2
  },
  // 1 — Power Surge
  {
    color:'#f87171',
    obj:'Contain Surge — Protect Asset', strat:'Route Overflow → VICS Cascade', conf:'91%',
    cam:{ox:0,oy:-0.1,z:1.2},
    voice:"<strong>+68V surge detected.</strong> SC1 intercepts.<br>VICS absorbs the overflow.",
    sub:"SURGE CONTAINED · ASSET ISOLATED · SOH INTACT",
    acts:[
      {t:0,    fn:()=>{ pulse('mut',1.6,'#f87171'); for(let i=0;i<5;i++) setTimeout(()=>shoot('mut','sc1','#f87171',4,7),i*150); }},
      {t:1.0,  fn:()=>{ pulse('sc1',1.5,'#fbbf24'); shoot('sc1','bank','#fbbf24',6,6); narrator("SC1 <strong>boost mode</strong> — ×1.45 amplification.","ABSORBING SURGE ENERGY"); }},
      {t:2.0,  fn:()=>{ pulse('bank',1.3); shoot('bank','va','#818cf8',5,6); narrator("Overflow routed to <em>VICS Chamber A</em>.","VICS INTAKE CONDUIT ACTIVE"); }},
      {t:3.0,  fn:()=>{ pulse('va',1.4); shoot('va','vb','#a78bfa',5,6); narrator("Chamber A pulses energy into <strong>Chamber B</strong>.","RESONANCE CONDUIT CHARGING"); }},
      {t:4.0,  fn:()=>{ pulse('vb',1.3); shoot('vb','vc','#c084fc',4,5); shoot('vc','cea','#34d399',4,5); narrator("Cascade complete. <em>Critical Asset insulated.</em>","SURGE ABSORBED · SOH 100%"); }},
    ],
    len: 5.5
  },
  // 2 — Load Spike
  {
    color:'#fbbf24',
    obj:'Compensate D3 Demand', strat:'Emergency Pull C ← B ← A', conf:'87%',
    cam:{ox:0,oy:0.2,z:1.3},
    voice:"Device 3 drawing <strong>40% above nominal.</strong><br>Emergency cascade activated.",
    sub:"VICS C EMERGENCY · CASCADE PULL · FLOOR PROTECTED",
    acts:[
      {t:0,    fn:()=>{ pulse('d3',1.6,'#fbbf24'); pulse('cea',1.3,'#fbbf24'); narrator("Device 3 <strong>load spike detected.</strong>","DEMAND +40% ABOVE NOMINAL"); }},
      {t:1.2,  fn:()=>{ pulse('vc',1.5,'#c084fc'); shoot('vc','cea','#34d399',6,7); narrator("VICS C floor guardian <em>fires immediately</em>.","EMERGENCY BURST TO CRITICAL ASSET"); }},
      {t:2.2,  fn:()=>{ pulse('vb',1.4); shoot('vb','vc','#c084fc',5,6); narrator("Chamber B refilling C.<br><strong>Cascade pull in motion.</strong>","B → C EMERGENCY TRANSFER"); }},
      {t:3.2,  fn:()=>{ pulse('va',1.3); shoot('va','vb','#a78bfa',4,5); narrator("Chamber A feeds B.<br><em>Three layers held the spike.</em>","FULL CASCADE ABSORBED · 0 DEEP DISCHARGE"); }},
    ],
    len: 4.8
  },
  // 3 — Grid Failure
  {
    color:'#60a5fa',
    obj:'Sustain Devices — MUT Offline', strat:'Draw VICS Reservoir Autonomously', conf:'83%',
    cam:{ox:0,oy:0,z:1.0},
    voice:"<strong>Grid feed lost.</strong> No external input.<br>Operating on stored reserves.",
    sub:"AUTONOMOUS MODE · VICS SUSTAINING · DEVICES ON",
    acts:[
      {t:0,    fn:()=>{ pulse('mut',1.2,'#f87171'); narrator("<strong>MUT offline.</strong> External feed interrupted.","SWITCHING TO AUTONOMOUS OPERATION"); }},
      {t:1.5,  fn:()=>{ pulse('vb',1.5,'#a78bfa'); shoot('vb','vc','#a78bfa',5,6); narrator("VICS reservoir <em>becomes the primary source</em>.","DRAWING FROM STORED ENERGY"); }},
      {t:2.5,  fn:()=>{ shoot('vc','cea','#34d399',5,6); pulse('vc',1.3); narrator("Chamber C releasing regulated energy.<br><strong>Devices remain powered.</strong>","UNINTERRUPTED UPTIME"); }},
      {t:3.5,  fn:()=>{ shoot('cea','d2','#60a5fa',4,5); shoot('cea','d3','#60a5fa',4,5); pulse('d2',1.2); pulse('d3',1.2); narrator("D2 and D3 <em>fully sustained</em> from reserves.<br>No human intervention required.","AUTONOMOUS OPERATION CONFIRMED"); }},
    ],
    len: 5.2
  },
  // 4 — Contaminant
  {
    color:'#a78bfa',
    obj:'Reclaim Contaminated Energy', strat:'Isolate → Filter → Cascade', conf:'89%',
    cam:{ox:0,oy:0,z:1.1},
    voice:"<strong>Contaminated source detected.</strong><br>VICS isolates, filters, and reclaims.",
    sub:"ISOLATION ACTIVE · ENERGY RECLAIMED · ASSET CLEAN",
    acts:[
      {t:0,    fn:()=>{ pulse('mut',1.4,'#a78bfa'); for(let i=0;i<4;i++) setTimeout(()=>shoot('mut','sc1','#a78bfa',3,6),i*200); narrator("<strong>Contaminated input detected</strong> on MUT.","ISOLATION STAGE ENGAGED"); }},
      {t:1.5,  fn:()=>{ pulse('sc1',1.3,'#a78bfa'); shoot('sc1','bank','#a78bfa',4,5); narrator("SC1 filtering contaminated energy.<br><em>Isolation stage active.</em>","PROCESSING — DO NOT ROUTE DIRECT"); }},
      {t:2.5,  fn:()=>{ shoot('bank','va','#818cf8',4,5); pulse('va',1.4,'#a78bfa'); narrator("VICS Chamber A acts as <strong>first-stage filter</strong>.<br>+18J reclaimed from contaminated source.","CLEAN ENERGY EXTRACTED"); }},
      {t:3.5,  fn:()=>{ shoot('va','vb','#a78bfa',4,5); shoot('vb','vc','#c084fc',4,5); shoot('vc','cea','#34d399',4,5); narrator("<em>Clean energy cascades</em> through B → C → Asset.<br>Zero contamination reached the asset.","RECLAIM COMPLETE · SOH 100%"); }},
    ],
    len: 5.0
  },
  // 5 — Recovery
  {
    color:'#2dd4bf',
    obj:'Full System Restore', strat:'Rebuild A → B → C → Asset', conf:'98%',
    cam:{ox:0,oy:0,z:1.0},
    voice:"Recovery sequence <strong>initiated.</strong><br>Rebuilding all reserves in sequence.",
    sub:"A REBUILDING · B CHARGING · C PRIMING · ASSET RISING",
    acts:[
      {t:0,    fn:()=>{ NKEYS.forEach(k=>{N[k].alertCol=null;N[k].alertT=0;}); shoot('mut','sc1','#4ade80',3,5); narrator("Recovery sequence <strong>initiated.</strong>","ALL CHAMBERS REBUILDING IN SEQUENCE"); }},
      {t:1.0,  fn:()=>{ pulse('va',1.4,'#2dd4bf'); shoot('sc1','bank','#3b82f6',4,5); shoot('bank','va','#818cf8',4,5); narrator("Chamber A charging to threshold.<br><em>30J target.</em>","INTAKE CONDUIT — FILLING"); }},
      {t:2.0,  fn:()=>{ pulse('vb',1.4,'#2dd4bf'); shoot('va','vb','#a78bfa',5,6); narrator("A pulses to Chamber B.<br><strong>Resonance conduit activating.</strong>","CHAMBER B — RESONANCE REBUILDING"); }},
      {t:3.0,  fn:()=>{ pulse('vc',1.4,'#2dd4bf'); shoot('vb','vc','#c084fc',5,6); narrator("B feeds Chamber C.<br><em>Output guardian primed.</em>","CHAMBER C — FLOOR GUARDIAN ARMED"); }},
      {t:4.0,  fn:()=>{ pulse('cea',1.5,'#2dd4bf'); shoot('vc','cea','#34d399',6,6); narrator("<strong>All reserves restored.</strong><br>Asset climbing toward float target.","FULL RECOVERY · SOH 100% · MISSION COMPLETE"); }},
      {t:5.0,  fn:()=>{ shoot('cea','d2','#60a5fa',4,5); shoot('cea','d3','#60a5fa',4,5); pulse('d2',1.2); pulse('d3',1.2); }},
    ],
    len: 6.2
  },
];

// ─────────────────────────────────────────────
// NARRATOR
// ─────────────────────────────────────────────
function narrator(text, sub) {
  const t = document.getElementById('narrator-text');
  const s = document.getElementById('narrator-sub');
  t.style.opacity='0'; s.style.opacity='0';
  setTimeout(()=>{ t.innerHTML=text; s.textContent=sub||''; t.style.opacity='1'; s.style.opacity='1'; },260);
}

function updateThought(sc) {
  document.getElementById('th-obj').textContent   = sc.obj;
  document.getElementById('th-strat').textContent = sc.strat;
  document.getElementById('th-conf').textContent  = 'Confidence: ' + sc.conf;
  document.getElementById('thought').style.opacity = '1';
}

// ─────────────────────────────────────────────
// SCENARIO RUNNER
// ─────────────────────────────────────────────
let looping = false, loopT = 0, loopSC = SC[0];
let activeSC = 0;

function runScenario(idx) {
  looping = false;
  loopT   = 0;
  loopSC  = SC[idx];
  activeSC = idx;

  // camera
  camT.ox = loopSC.cam.ox;
  camT.oy = loopSC.cam.oy;
  camT.z  = loopSC.cam.z;

  // narrator
  narrator(loopSC.voice, loopSC.sub);
  updateThought(loopSC);

  // reset node alerts
  NKEYS.forEach(k=>{ if(N[k]){N[k].alertCol=null;N[k].alertT=0;} });

  looping = true;
}

// pill clicks
document.querySelectorAll('.pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    runScenario(+btn.dataset.i);
  });
});

// ─────────────────────────────────────────────
// FRAME LOOP
// ─────────────────────────────────────────────
let last=0;
function frame(ts){
  const dt = Math.min((ts-last)/1000, 0.05); last=ts;

  // camera lerp
  cam.ox += (camT.ox-cam.ox)*dt*3;
  cam.oy += (camT.oy-cam.oy)*dt*3;
  cam.z  += (camT.z -cam.z )*dt*3;

  // node decay
  NKEYS.forEach(k=>{
    if(!N[k]) return;
    N[k].glow  = Math.max(0, N[k].glow  - dt*0.8);
    N[k].scale = 1 + (N[k].scale-1)*Math.exp(-dt*4);
    if(N[k].alertT>0) N[k].alertT = Math.max(0, N[k].alertT - dt*0.35);
  });

  // scenario loop
  if(looping && loopSC){
    const phase = loopT % loopSC.len;
    loopSC.acts.forEach(a=>{
      if(phase >= a.t && phase < a.t + dt + 0.04) a.fn();
    });
    loopT += dt;
  }

  // particles
  P.forEach(p=>{
    if(!p.on) return;
    p.t+=p.spd;
    if(p.t>=1){p.on=false;return;}
    const m=1-p.t;
    p.x=m*m*p.sx+2*m*p.t*p.ex+p.t*p.t*p.tx;
    p.y=m*m*p.sy+2*m*p.t*p.ey+p.t*p.t*p.ty;
    p.tr.unshift({x:p.x,y:p.y});
    if(p.tr.length>10) p.tr.pop();
  });

  draw();
  requestAnimationFrame(frame);
}

// ─────────────────────────────────────────────
// DRAW
// ─────────────────────────────────────────────
function draw(){
  cx.clearRect(0,0,W,H);

  // deep space bg
  const bg=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.8);
  bg.addColorStop(0,'#06090f'); bg.addColorStop(1,'#010204');
  cx.fillStyle=bg; cx.fillRect(0,0,W,H);

  // subtle star field
  cx.fillStyle='rgba(255,255,255,0.018)';
  for(let x=30;x<W;x+=48) for(let y=30;y<H;y+=48){
    if(Math.sin(x*0.7+y*0.3)>0.6){cx.beginPath();cx.arc(x,y,0.8,0,Math.PI*2);cx.fill();}
  }

  if(!N.mut) return;

  // camera
  const ox=W/2*cam.ox*0.08, oy=H/2*cam.oy*0.08;
  cx.save();
  cx.translate(W/2+ox, H/2+oy);
  cx.scale(cam.z,cam.z);
  cx.translate(-W/2,-H/2);

  // edges
  EDGES.forEach(e=>{
    const a=N[e.a],b=N[e.b]; if(!a||!b) return;
    cx.beginPath(); cx.moveTo(a.x,a.y);
    const mx=(a.x+b.x)/2;
    cx.bezierCurveTo(mx,a.y,mx,b.y,b.x,b.y);
    cx.strokeStyle=e.c+'18'; cx.lineWidth=1.5; cx.stroke();
  });

  // nodes
  NKEYS.forEach(k=>{
    const n=N[k]; if(!n) return;
    const r=n.size*n.scale;
    const g=n.glow;
    const ac=n.alertT>0&&n.alertCol;
    const col=ac?lerpCol(n.color,n.alertCol,Math.min(1,n.alertT*2)):n.color;

    cx.save(); cx.translate(n.x,n.y);

    // glow halo
    if(g>0.05||ac){
      const ga=cx.createRadialGradient(0,0,r,0,0,r*3.2);
      const alpha=Math.max(g,n.alertT||0);
      ga.addColorStop(0,col+Math.floor(alpha*80).toString(16).padStart(2,'0'));
      ga.addColorStop(1,col+'00');
      cx.fillStyle=ga; cx.beginPath(); cx.arc(0,0,r*3.2,0,Math.PI*2); cx.fill();
    }

    // ambient breathe
    const bp=Math.sin(Date.now()/900+n.x*0.01)*0.5+0.5;
    const ab=cx.createRadialGradient(0,0,r*.1,0,0,r*1.8);
    ab.addColorStop(0,col+'20'); ab.addColorStop(1,col+'00');
    cx.fillStyle=ab; cx.beginPath(); cx.arc(0,0,r*1.8+bp*4,0,Math.PI*2); cx.fill();

    // sphere
    const sg=cx.createRadialGradient(-r*.3,-r*.3,r*.06,0,0,r);
    sg.addColorStop(0,lighten(col,0.4));
    sg.addColorStop(0.5,col);
    sg.addColorStop(1,darken(col,0.5));
    cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.fillStyle=sg; cx.fill();

    // rim
    cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2);
    cx.strokeStyle=col+(g>0.08||ac?'cc':'44'); cx.lineWidth=g>0.08||ac?2.5:1.2; cx.stroke();

    // specular
    const hi=cx.createRadialGradient(-r*.4,-r*.38,0,-r*.33,-r*.33,r*.55);
    hi.addColorStop(0,'rgba(255,255,255,.42)'); hi.addColorStop(1,'rgba(255,255,255,0)');
    cx.fillStyle=hi; cx.beginPath(); cx.arc(0,0,r,0,Math.PI*2); cx.fill();

    // label
    cx.fillStyle='rgba(255,255,255,.9)';
    cx.font=`700 ${Math.max(8,r*.34)}px system-ui,sans-serif`;
    cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(n.label,0,0);

    cx.restore();
  });

  // particles
  P.forEach(p=>{
    if(!p.on) return;
    // trail
    for(let i=1;i<p.tr.length;i++){
      const al=Math.floor((1-i/p.tr.length)*(1-p.t)*140).toString(16).padStart(2,'0');
      cx.beginPath(); cx.moveTo(p.tr[i-1].x,p.tr[i-1].y); cx.lineTo(p.tr[i].x,p.tr[i].y);
      cx.strokeStyle=p.col+al; cx.lineWidth=p.sz*(1-i/p.tr.length)*0.9; cx.lineCap='round'; cx.stroke();
    }
    // glow
    const pg=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.sz*2.4);
    pg.addColorStop(0,p.col+'ff'); pg.addColorStop(.4,p.col+'99'); pg.addColorStop(1,p.col+'00');
    cx.fillStyle=pg; cx.beginPath(); cx.arc(p.x,p.y,p.sz*2.4,0,Math.PI*2); cx.fill();
    // core
    cx.fillStyle='#fff'; cx.beginPath(); cx.arc(p.x,p.y,p.sz*.5,0,Math.PI*2); cx.fill();
  });

  cx.restore();
}

// ─────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────
resize();
runScenario(0);
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
</script>
</body>
</html>
