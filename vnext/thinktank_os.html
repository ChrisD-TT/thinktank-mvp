<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ThinkTank OS</title>

<style>

body{
    background:#030a16;
    color:white;
    font-family:Segoe UI,sans-serif;
    margin:0;
    padding:20px;
}

h1{
    color:#34d399;
}

.grid{
    display:grid;
    grid-template-columns:1fr 2fr 1fr;
    gap:15px;
    margin-top:20px;
}

.panel{
    background:#071626;
    border-radius:12px;
    padding:20px;
}

.full{
    grid-column:1 / -1;
}

.metric{
    font-size:32px;
    font-weight:bold;
}

</style>

</head>

<body>

<h1>ThinkTank OS</h1>

<p>Sensor Twin Engine • Autonomous Recovery Platform</p>

<div class="grid">

    <div class="panel">

        <h2>ThinkTank Agent</h2>

        <p>Observe</p>
        <p>Understand</p>
        <p>Predict</p>
        <p>Act</p>
        <p>Explain</p>

    </div>

    <div class="panel">

        <h2>Sensor Twin Core</h2>

        <div class="metric" id="cpuTemp">84°C</div>
        <div class="metric" id="cpuLoad">91%</div>
        <div class="metric" id="ramUsage">67%</div>
        <div class="metric" id="batteryPct">88%</div>

    </div>

    <div class="panel">

        <h2>Recovery Bank</h2>

        <p>R1</p>
        <p>R2</p>
        <p>R3</p>
        <p>R4</p>
        <p>R5</p>

    </div>

    <div class="panel full">

        <h2>VICS Recovery Cascade</h2>

        <p>A protects B</p>
        <p>B protects C</p>
        <p>C protects System</p>

    </div>

    <div class="panel full">

        <h2>Mission Log</h2>

        <div id="log">
            System Started
        </div>

    </div>

</div>

<script>

function tick(){

    document.getElementById("cpuTemp").textContent =
        (60 + Math.floor(Math.random()*30)) + "°C";

    document.getElementById("cpuLoad").textContent =
        (20 + Math.floor(Math.random()*80)) + "%";

    document.getElementById("ramUsage").textContent =
        (30 + Math.floor(Math.random()*60)) + "%";

}

setInterval(tick,2000);

</script>

</body>
</html>
